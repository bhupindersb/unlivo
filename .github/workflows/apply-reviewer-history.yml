name: Apply reviewer history display

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Prepare reviewer history display update')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reviewer history display
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/admin/properties/page.tsx')
          s = p.read_text()
          s = s.replace('const r=await supabase.from("profiles").select("id,full_name,email,role,access_status").eq("role","reviewer").eq("access_status","active").order("full_name");', 'const r=await supabase.from("profiles").select("id,full_name,email,role,access_status").eq("role","reviewer").order("full_name");')
          s = s.replace('const assigned=reviewers.find(r=>r.id===review?.assigned_to);\n            const stats=assigned?reviewerStats[assigned.id]:undefined;\n            const canReview=userRole==="admin"||review?.assigned_to===currentUserId;', 'const assigned=reviewers.find(r=>r.id===review?.assigned_to);\n            const completedReviewer=review?.reviewed_by?reviewers.find(r=>r.id===review.reviewed_by):undefined;\n            const stats=assigned?reviewerStats[assigned.id]:undefined;\n            const canReview=userRole==="admin"||review?.assigned_to===currentUserId;')
          old = '<td className="px-5 py-5">{property.status==="pending_review"&&review?(userRole==="admin"?<div className="min-w-[230px]">'
          new = '<td className="px-5 py-5">{property.status==="pending_review"&&review?(userRole==="admin"?<div className="min-w-[230px]">'
          # Replace only the final fallback after the existing pending-review branch.
          s = s.replace('</div>:<span className="text-xs text-[#9aa8af]">—</span>}</td>', '</div>:completedReviewer?<div><p className="font-bold text-[#123b53]">{completedReviewer.full_name||"Reviewer"}</p><p className="text-xs text-[#81929b]">Completed review</p></div>:<span className="text-xs text-[#9aa8af]">—</span>}</td>', 1)
          if 'const completedReviewer=' not in s or 'Completed review' not in s:
              raise SystemExit('Expected reviewer table pattern was not found; no commit made.')
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/properties/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Show completed reviewer in properties table"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/apply-reviewer-history.yml
          git commit -m "Remove temporary reviewer history workflow"
          git push
